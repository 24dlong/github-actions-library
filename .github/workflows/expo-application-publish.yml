# Reusable publish workflow for an Expo application (local EAS builds, then
# store submit). Not run in this repository: on.workflow_call only.
#
# Jobs: Detect (always builds; change detection is the spoke's follow-up),
# Android on ubuntu-24.04, iOS on macos-26 with Xcode 26.4.1, then Summary.
# With a caller job named Mobile, the checks are Mobile / Detect, Mobile /
# Android, Mobile / iOS and Mobile / Summary.
#
# Reads these caller repository (or GitHub Environment) variables, all
# CodeArtifact: AWS_CODE_ARTIFACT_ACCOUNT_ID, AWS_REGION, AWS_ROLE_TO_ASSUME,
# AWS_CODE_ARTIFACT_DOMAIN, AWS_CODE_ARTIFACT_REPOSITORY, REGISTRY_NAMESPACE.
#
# Build jobs run in `environment` (default production) so the OIDC subject is
# repo:<owner>/<repo>:environment:<environment> and environment secrets are
# available. The caller passes expo-token and sentry-auth-token by name from
# EXPO_TOKEN and SENTRY_AUTH_TOKEN, including when those exist only on the
# environment.
#
# The caller job must grant `id-token: write`, `contents: read` and
# `actions: write` (artifact upload and caches).

name: Expo Application Publish

on:
  workflow_call:
    inputs:
      version:
        description: Released app version, exported to the build as APP_VERSION.
        required: true
        type: string
      working-directory:
        description: Directory of the Expo project, relative to the repository root (e.g. "apps/mobile").
        required: true
        type: string
      platforms:
        description: Comma-separated platforms to build (ios, android, or both).
        required: false
        type: string
        default: ios,android
      build-profile:
        description: eas.json build profile. Use production for store artifacts.
        required: false
        type: string
        default: production
      submit:
        description: Submit the artifacts to TestFlight and the Play internal track.
        required: false
        type: boolean
        default: true
      environment:
        description: GitHub Environment for the build jobs.
        required: false
        type: string
        default: production
    secrets:
      expo-token:
        description: Expo robot token, passed from EXPO_TOKEN.
        required: true
      sentry-auth-token:
        description: Sentry auth token, passed from SENTRY_AUTH_TOKEN.
        required: true

concurrency:
  group: expo-publish-${{ github.repository }}-${{ inputs.working-directory }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        # Task 5 replaces this with a comparison against the previous release tag.
        run: echo "build=true" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: detect
    if: needs.detect.outputs.build == 'true' && contains(inputs.platforms, 'android')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      actions: write
    # Build and submit outcomes are reported apart so Summary can tell a
    # failed submit from a failed build.
    outputs:
      artifact: ${{ steps.build.outputs.artifact-path }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      build-number: ${{ steps.build.outputs.build-number }}
      build-result: ${{ steps.build.outcome }}
      submit-result: ${{ steps.submit.outcome }}
    steps:
      - id: build
        uses: 24dlong/github-actions-library/actions/javascript/expo/build@v7
        with:
          working-directory: ${{ inputs.working-directory }}
          platform: android
          profile: ${{ inputs.build-profile }}
          version: ${{ inputs.version }}
          expo-token: ${{ secrets.expo-token }}
          sentry-auth-token: ${{ secrets.sentry-auth-token }}
          codeartifact-aws-account-id: ${{ vars.AWS_CODE_ARTIFACT_ACCOUNT_ID }}
          codeartifact-aws-region: ${{ vars.AWS_REGION }}
          codeartifact-aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          codeartifact-domain: ${{ vars.AWS_CODE_ARTIFACT_DOMAIN }}
          codeartifact-repository: ${{ vars.AWS_CODE_ARTIFACT_REPOSITORY }}
          codeartifact-registry-namespace: ${{ vars.REGISTRY_NAMESPACE }}

      - name: Submit
        id: submit
        if: inputs.submit
        uses: 24dlong/github-actions-library/actions/javascript/expo/submit@v7
        with:
          working-directory: ${{ inputs.working-directory }}
          platform: android
          artifact: ${{ steps.build.outputs.artifact-path }}
          expo-token: ${{ secrets.expo-token }}

  ios:
    name: iOS
    needs: detect
    if: needs.detect.outputs.build == 'true' && contains(inputs.platforms, 'ios')
    runs-on: macos-26
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      actions: write
    # Build and submit outcomes are reported apart so Summary can tell a
    # failed submit from a failed build.
    outputs:
      artifact: ${{ steps.build.outputs.artifact-path }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      build-number: ${{ steps.build.outputs.build-number }}
      build-result: ${{ steps.build.outcome }}
      submit-result: ${{ steps.submit.outcome }}
    steps:
      - id: build
        uses: 24dlong/github-actions-library/actions/javascript/expo/build@v7
        with:
          working-directory: ${{ inputs.working-directory }}
          platform: ios
          profile: ${{ inputs.build-profile }}
          version: ${{ inputs.version }}
          expo-token: ${{ secrets.expo-token }}
          sentry-auth-token: ${{ secrets.sentry-auth-token }}
          codeartifact-aws-account-id: ${{ vars.AWS_CODE_ARTIFACT_ACCOUNT_ID }}
          codeartifact-aws-region: ${{ vars.AWS_REGION }}
          codeartifact-aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          codeartifact-domain: ${{ vars.AWS_CODE_ARTIFACT_DOMAIN }}
          codeartifact-repository: ${{ vars.AWS_CODE_ARTIFACT_REPOSITORY }}
          codeartifact-registry-namespace: ${{ vars.REGISTRY_NAMESPACE }}

      - name: Submit
        id: submit
        if: inputs.submit
        uses: 24dlong/github-actions-library/actions/javascript/expo/submit@v7
        with:
          working-directory: ${{ inputs.working-directory }}
          platform: ios
          artifact: ${{ steps.build.outputs.artifact-path }}
          expo-token: ${{ secrets.expo-token }}

  summary:
    name: Summary
    needs: [detect, android, ios]
    if: always() && !cancelled() && needs.detect.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Write summary
        env:
          VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.build-profile }}
          SUBMIT: ${{ inputs.submit }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_BUILD: ${{ needs.android.outputs.build-result }}
          ANDROID_SUBMIT: ${{ needs.android.outputs.submit-result }}
          ANDROID_ARTIFACT: ${{ needs.android.outputs.artifact }}
          ANDROID_ARTIFACT_NAME: ${{ needs.android.outputs.artifact-name }}
          ANDROID_BUILD_NUMBER: ${{ needs.android.outputs.build-number }}
          IOS_RESULT: ${{ needs.ios.result }}
          IOS_BUILD: ${{ needs.ios.outputs.build-result }}
          IOS_SUBMIT: ${{ needs.ios.outputs.submit-result }}
          IOS_ARTIFACT: ${{ needs.ios.outputs.artifact }}
          IOS_ARTIFACT_NAME: ${{ needs.ios.outputs.artifact-name }}
          IOS_BUILD_NUMBER: ${{ needs.ios.outputs.build-number }}
        run: |
          set -euo pipefail
          past() {
            case "$1" in
              success) echo succeeded ;;
              failure) echo failed ;;
              *) echo "$1" ;;
            esac
          }
          # Args: label, job result, build outcome, submit outcome, artifact
          # name, artifact path, build number. Prints one table row.
          row() {
            local label="$1" job="$2" build="$3" submit="$4" status
            if [[ "${job}" == "skipped" ]]; then
              build="not requested"
              submit="n/a"
            else
              # Empty when the job ended before the build step reported.
              build="${build:-${job}}"
              if [[ "${SUBMIT}" != "true" ]]; then
                submit="disabled"
              elif [[ "${build}" != "success" ]]; then
                submit="not run"
              else
                submit="${submit:-${job}}"
              fi
            fi
            if [[ "${build}" == "not requested" ]]; then
              status="Not requested"
            elif [[ "${build}" != "success" ]]; then
              status="Build $(past "${build}")"
            elif [[ "${submit}" == "disabled" ]]; then
              status="Build succeeded, submit disabled"
            elif [[ "${submit}" == "success" ]]; then
              status="Build and submit succeeded"
            else
              status="Build succeeded, submit $(past "${submit}")"
            fi
            echo "| ${label} | ${status} | ${build} | ${submit} | \`${5:-n/a}\` | \`${6:-n/a}\` | ${7:-n/a} |"
          }
          {
            echo "## Expo publish"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Profile: \`${PROFILE}\`"
            echo "- Submit: \`${SUBMIT}\`"
            echo
            echo "| Platform | Status | Build | Submit | Artifact | Path | Build number |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            row Android "${ANDROID_RESULT}" "${ANDROID_BUILD}" "${ANDROID_SUBMIT}" \
              "${ANDROID_ARTIFACT_NAME}" "${ANDROID_ARTIFACT}" "${ANDROID_BUILD_NUMBER}"
            row iOS "${IOS_RESULT}" "${IOS_BUILD}" "${IOS_SUBMIT}" \
              "${IOS_ARTIFACT_NAME}" "${IOS_ARTIFACT}" "${IOS_BUILD_NUMBER}"
          } >> "$GITHUB_STEP_SUMMARY"
