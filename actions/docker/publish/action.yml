name: Publish Image to ECR
description: >-
  Builds a single-platform container image with Docker Buildx and pushes it to
  an Amazon ECR repository using GitHub OIDC credentials. Optionally fetches an
  AWS CodeArtifact token for the build so private packages can be installed.
  Outputs the pushed tag, the image digest, and a digest-pinned image URI.

inputs:
  aws-role-to-assume:
    description: ARN of the AWS IAM role to assume. Must allow pushing to the ECR repository.
    required: true
  aws-region:
    description: AWS region hosting the ECR repository.
    required: false
    default: us-east-2
  ecr-repository-uri:
    description: >-
      Full ECR repository URI without a tag
      (e.g. 123456789012.dkr.ecr.us-east-2.amazonaws.com/my-app).
    required: true
  dockerfile:
    description: Path to the Dockerfile, relative to the repository root.
    required: false
    default: Dockerfile
  context:
    description: Docker build context, relative to the repository root.
    required: false
    default: .
  platform:
    description: >-
      Target platform. Must be a single platform: Lambda rejects multi-platform
      image indexes. Match the Lambda function's architecture.
    required: false
    default: linux/arm64
  image-tag:
    description: >-
      Tag applied to the pushed image. Defaults to the triggering commit sha.
      If the repository uses immutable tags, re-publishing an existing tag fails at push.
    required: false
    default: ${{ github.sha }}
  secrets:
    description: >-
      Newline-separated BuildKit secrets in id=value form, consumed in the
      Dockerfile with RUN --mount=type=secret,id=<id>. Never baked into image layers.
    required: false
    default: ""
  build-args:
    description: Newline-separated build arguments in KEY=value form.
    required: false
    default: ""
  AWS_ACCOUNT_ID:
    description: AWS Account ID hosting CodeArtifact. Required when AWS_CODE_ARTIFACT_DOMAIN is set.
    required: false
    default: ""
  AWS_REGION:
    description: AWS region hosting CodeArtifact. Defaults to aws-region.
    required: false
    default: ""
  AWS_ROLE_TO_ASSUME:
    description: AWS role to assume for CodeArtifact repository access. Required when AWS_CODE_ARTIFACT_DOMAIN is set.
    required: false
    default: ""
  AWS_CODE_ARTIFACT_DOMAIN:
    description: >-
      AWS CodeArtifact domain. When set, a CodeArtifact token is passed to the
      build as the `codeartifact_token` BuildKit secret, and AWS_REGION,
      AWS_ACCOUNT_ID, AWS_CODE_ARTIFACT_DOMAIN, AWS_CODE_ARTIFACT_REPOSITORY and
      REGISTRY_NAMESPACE are passed as build args.
    required: false
    default: ""
  AWS_CODE_ARTIFACT_REPOSITORY:
    description: AWS CodeArtifact repository.
    required: false
    default: ""
  REGISTRY_NAMESPACE:
    description: Namespace to use for registry authentication.
    required: false
    default: ""

outputs:
  image-tag:
    description: Tag of the pushed image.
    value: ${{ inputs.image-tag }}
  digest:
    description: Digest of the pushed image (sha256:...).
    value: ${{ steps.build.outputs.digest }}
  image-uri:
    description: Digest-pinned image URI (<ecr-repository-uri>@sha256:...).
    value: ${{ inputs.ecr-repository-uri }}@${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Get CodeArtifact Token
      id: codeartifact
      if: inputs.AWS_CODE_ARTIFACT_DOMAIN != ''
      uses: 24dlong/github-actions-library/actions/aws/codeartifact-token@v6
      with:
        AWS_ACCOUNT_ID: ${{ inputs.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ inputs.AWS_REGION || inputs.aws-region }}
        AWS_ROLE_TO_ASSUME: ${{ inputs.AWS_ROLE_TO_ASSUME }}
        AWS_CODE_ARTIFACT_DOMAIN: ${{ inputs.AWS_CODE_ARTIFACT_DOMAIN }}

    - name: Assemble build inputs
      id: inputs
      shell: bash
      env:
        SECRETS: ${{ inputs.secrets }}
        BUILD_ARGS: ${{ inputs.build-args }}
        CODEARTIFACT_TOKEN: ${{ steps.codeartifact.outputs.token }}
        CA_REGION: ${{ inputs.AWS_REGION || inputs.aws-region }}
        CA_ACCOUNT_ID: ${{ inputs.AWS_ACCOUNT_ID }}
        CA_DOMAIN: ${{ inputs.AWS_CODE_ARTIFACT_DOMAIN }}
        CA_REPOSITORY: ${{ inputs.AWS_CODE_ARTIFACT_REPOSITORY }}
        CA_NAMESPACE: ${{ inputs.REGISTRY_NAMESPACE }}
      run: |
        set -euo pipefail
        if [[ -n "$CA_DOMAIN" ]]; then
          SECRETS="$(printf '%s\ncodeartifact_token=%s' "$SECRETS" "$CODEARTIFACT_TOKEN")"
          BUILD_ARGS="$(printf '%s\nAWS_REGION=%s\nAWS_ACCOUNT_ID=%s\nAWS_CODE_ARTIFACT_DOMAIN=%s\nAWS_CODE_ARTIFACT_REPOSITORY=%s\nREGISTRY_NAMESPACE=%s' \
            "$BUILD_ARGS" "$CA_REGION" "$CA_ACCOUNT_ID" "$CA_DOMAIN" "$CA_REPOSITORY" "$CA_NAMESPACE")"
        fi
        delimiter="EOF_$(openssl rand -hex 8)"
        {
          echo "secrets<<${delimiter}"
          echo "$SECRETS"
          echo "${delimiter}"
          echo "build-args<<${delimiter}"
          echo "$BUILD_ARGS"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platform }}
        tags: ${{ inputs.ecr-repository-uri }}:${{ inputs.image-tag }}
        secrets: ${{ steps.inputs.outputs.secrets }}
        build-args: ${{ steps.inputs.outputs.build-args }}
        push: true
        # Lambda only accepts a plain single-platform image manifest; attestations
        # turn the push into an OCI image index, which Lambda rejects.
        provenance: false
        sbom: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
