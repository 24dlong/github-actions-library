name: CodeArtifact Token
description: >-
  Assumes an AWS IAM role via GitHub OIDC and fetches a masked AWS CodeArtifact
  authorization token. The assumed role's credentials remain in the job
  environment for later steps.

inputs:
  AWS_ACCOUNT_ID:
    description: AWS Account ID hosting CodeArtifact
    required: true
  AWS_REGION:
    description: AWS region hosting CodeArtifact
    required: true
  AWS_ROLE_TO_ASSUME:
    description: AWS role to assume for CodeArtifact repository access
    required: true
  AWS_CODE_ARTIFACT_DOMAIN:
    description: AWS CodeArtifact domain
    required: true

outputs:
  token:
    description: CodeArtifact authorization token (masked in logs).
    value: ${{ steps.token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.AWS_REGION }}
        role-to-assume: ${{ inputs.AWS_ROLE_TO_ASSUME }}

    - name: Get CodeArtifact Token
      id: token
      shell: bash
      env:
        AWS_CODE_ARTIFACT_DOMAIN: ${{ inputs.AWS_CODE_ARTIFACT_DOMAIN }}
        AWS_ACCOUNT_ID: ${{ inputs.AWS_ACCOUNT_ID }}
      run: |
        set -euo pipefail
        token="$(aws codeartifact get-authorization-token \
          --domain "$AWS_CODE_ARTIFACT_DOMAIN" \
          --domain-owner "$AWS_ACCOUNT_ID" \
          --query authorizationToken \
          --output text)"
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
