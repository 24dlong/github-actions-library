name: Publish
description: >-
  Checks out the repository with full history, bumps the project version with
  commitizen, and updates the major version tag pointer (e.g. v1, v2) to point
  at the latest release. Intended to run on push to main. Skips all steps when
  triggered by its own version-bump commit, to avoid retriggering itself.

inputs:
  GITHUB_WORKFLOWS_CLIENT_ID:
    description: >-
      The client ID of a GitHub App with permissions to bypass branch protection, push commits, and create tags.
    required: true
  GITHUB_WORKFLOWS_PRIVATE_KEY:
    description: >-
      The private key of a GitHub App with permissions to bypass branch protection, push commits, and create tags.
    required: true

outputs:
  version:
    description: The semver version bumped to by the workflow
    value: ${{ steps.bump.outputs.version }}

runs:
  using: composite
  steps:
    - name: Generate Github Token
      uses: actions/create-github-app-token@v3
      id: github-token
      with:
        client-id: ${{ inputs.GITHUB_WORKFLOWS_CLIENT_ID }}
        private-key: ${{ inputs.GITHUB_WORKFLOWS_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}

    - name: Checkout Code
      if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
      uses: actions/checkout@v7
      with:
        token: ${{ steps.github-token.outputs.token }}
        fetch-depth: 0

    - name: Bump Version
      id: bump
      if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
      uses: commitizen-tools/commitizen-action@0.27.1
      with:
        github_token: ${{ steps.github-token.outputs.token }}

    - name: Tag Major Version
      if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
      run: ${{ github.action_path }}/tag-major-version.sh
      shell: bash
