name: Publish
description: >-
  Checks out the repository with full history, bumps the project version with
  commitizen, and updates the major version tag pointer (e.g. v1, v2) to point
  at the latest release. Intended to run on push to main. Skips all steps when
  triggered by its own version-bump commit, to avoid retriggering itself.

inputs:
  GITHUB_TOKEN:
    description: >-
      Token used to push the version bump commit and tags. Must be able to
      bypass branch protection on the target branch (e.g. a personal access
      token or GitHub App installation token).
    required: true

outputs:
  version:
    description: The semver version bumped to by the workflow
    value: ${{ steps.bump.outputs.version }}

runs:
  using: composite
  steps:
    - name: Checkout Code
      if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Bump Version
      id: bump
      if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
      uses: commitizen-tools/commitizen-action@0.27.1
      with:
        github_token: ${{ inputs.GITHUB_TOKEN }}

    - name: Tag Major Version
      if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
      run: ${{ github.action_path }}/tag-major-version.sh
      shell: bash
