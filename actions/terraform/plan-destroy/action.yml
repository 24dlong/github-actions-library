name: Plan Destroy
description: >-
  Runs `make plan` with -destroy for a Terraform root, prints the
  rendered plan in the job logs, and uploads the binary plan as a
  same-run artifact so a later job in this workflow can apply it after
  GitHub Environment approval. Intended for workflow_dispatch destroy,
  not pull_request. The consumer Makefile must implement `make plan`.

inputs:
  working-directory:
    description: Path to the Terraform root module to plan (e.g. "infra"). Passed as INFRA_DIR.
    required: true
  environment:
    description: Terraform environment name (e.g. "production"). Passed as ENV.
    required: true
  aws-role-to-assume:
    description: ARN of the AWS IAM role to assume for the destroy plan (read-only credentials).
    required: true
  aws-region:
    description: AWS region to configure credentials for.
    required: false
    default: us-east-2

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Environment
      shell: bash
      run: make setup-env

    - name: Configure AWS credentials (plan role)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Plan destroy
      shell: bash
      run: make plan ENV=${{ inputs.environment }} INFRA_DIR=${{ inputs.working-directory }} TF_FLAGS="-destroy -lock=false -out=tfplan"

    - name: Show destroy plan
      shell: bash
      run: mise exec -- terraform -chdir=${{ inputs.working-directory }} show -no-color tfplan

    - name: Upload destroy plan artifact
      uses: actions/upload-artifact@v7
      with:
        name: tfplan-destroy-${{ github.run_id }}
        path: ${{ inputs.working-directory }}/tfplan
        if-no-files-found: error
        retention-days: 1
