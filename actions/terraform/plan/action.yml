name: Plan Changes
description: >-
  Runs `make plan` for a working directory, posts the rendered plan as a
  pull request comment labeled with the target environment, and uploads the
  plan as a build artifact so a later workflow run can apply the exact same
  plan after merge. The consumer Makefile must implement `make plan`
  (ENV, INFRA_DIR, TF_FLAGS).

inputs:
  working-directory:
    description: Path to the Terraform root module to plan (e.g. "infra"). Passed as INFRA_DIR.
    required: true
  environment:
    description: Environment name being planned (e.g. "production"). Passed as ENV and shown in the pull request comment.
    required: true
  aws-role-to-assume:
    description: ARN of the AWS IAM role to assume for the plan (read-only credentials).
    required: true
  aws-region:
    description: AWS region to configure credentials for.
    required: false
    default: us-east-2
  github-token:
    description: Token used to comment on the pull request. Typically secrets.GITHUB_TOKEN.
    required: true
  ref:
    description: >-
      Git branch, tag, or SHA to check out before planning. Omit to use the
      triggering event's ref (current behavior). For GitOps deploys, pass the
      pinned sha from deployed.json, not a moving branch name.
    required: false
    default: ""
  var-file:
    description: >-
      Path to a .tfvars file (e.g. environments/<env>/terraform.tfvars),
      passed to `make plan` as VAR_FILE. Omit to use the Makefile's own
      VAR_FILE.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Setup Environment
      shell: bash
      run: make setup-env

    - name: Configure AWS credentials (plan role)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Terraform plan
      shell: bash
      env:
        PLAN_ENV: ${{ inputs.environment }}
        PLAN_DIR: ${{ inputs.working-directory }}
        PLAN_VAR_FILE: ${{ inputs.var-file }}
      run: |
        set -euo pipefail
        args=(ENV="$PLAN_ENV" INFRA_DIR="$PLAN_DIR" TF_FLAGS="-lock=false -out=tfplan")
        if [ -n "$PLAN_VAR_FILE" ]; then
          args+=(VAR_FILE="$PLAN_VAR_FILE")
        fi
        make plan "${args[@]}"

    - name: Render plan text
      shell: bash
      run: mise exec -- terraform -chdir=${{ inputs.working-directory }} show -no-color tfplan > ${{ inputs.working-directory }}/tfplan.txt

    - name: Comment plan on PR
      uses: actions/github-script@v9
      env:
        PLAN_TEXT_PATH: ${{ inputs.working-directory }}/tfplan.txt
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = process.env.PLAN_TEXT_PATH;
          const plan = fs.readFileSync(path, 'utf8');
          const trimmed = plan.length > 60000 ? `${plan.slice(0, 60000)}\n\n...truncated...` : plan;
          const body = [
            `Terraform plan for \`${{ inputs.environment }}\`:`,
            '```diff',
            trimmed,
            '```'
          ].join('\n');
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });

    - name: Upload plan artifact
      uses: actions/upload-artifact@v7
      with:
        name: tfplan-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        path: |
          ${{ inputs.working-directory }}/tfplan
          ${{ inputs.working-directory }}/tfplan.txt
        if-no-files-found: error
