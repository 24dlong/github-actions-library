name: Setup JavaScript Environment without Install
description: >-
  Sets up a pnpm JavaScript project, assumes the CodeArtifact role, and exports
  the registry environment variables read by the consumer's registry
  authentication script (run by `make install` / `make registry-auth`):
  CODEARTIFACT_AUTH_TOKEN, AWS_ACCOUNT_ID, AWS_CODE_ARTIFACT_DOMAIN,
  AWS_CODE_ARTIFACT_REPOSITORY and REGISTRY_NAMESPACE. AWS_REGION is exported
  by the CodeArtifact credentials step.

inputs:
  codeartifact-aws-account-id:
    description: AWS account ID that owns the CodeArtifact domain.
    required: true
  codeartifact-aws-region:
    description: AWS region of the CodeArtifact domain.
    required: true
  codeartifact-aws-role-to-assume:
    description: ARN of the AWS IAM role allowed to read from CodeArtifact.
    required: true
  codeartifact-domain:
    description: CodeArtifact domain name.
    required: true
  codeartifact-repository:
    description: CodeArtifact repository name.
    required: true
  codeartifact-registry-namespace:
    description: npm scope served by CodeArtifact (e.g. "@my-org").
    required: true

outputs:
  pnpm-store-path:
    description: pnpm store directory, for actions/cache/save after install.
    value: ${{ steps.pnpm-store.outputs.path }}
  pnpm-cache-key:
    description: Cache key for the pnpm store, for actions/cache/save after install.
    value: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  pnpm-cache-hit:
    description: "'true' when the pnpm store was restored from an exact key match."
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Environment
      run: make setup-env
      shell: bash

    # Without an explicit version, uses packageManager version from package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    # setup-node's `cache: pnpm` only saves in its post step, which runs when
    # the whole job succeeds, so a job that fails late never saves. Restore
    # here; actions/javascript/setup saves right after install.
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Get pnpm store path
      id: pnpm-store
      run: |
        set -euo pipefail
        store="$(pnpm store path --silent)"
        echo "path=${store}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore pnpm store
      id: pnpm-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Get CodeArtifact Token
      id: codeartifact
      uses: 24dlong/github-actions-library/actions/aws/codeartifact-token@v7
      with:
        codeartifact-aws-account-id: ${{ inputs.codeartifact-aws-account-id }}
        codeartifact-aws-region: ${{ inputs.codeartifact-aws-region }}
        codeartifact-aws-role-to-assume: ${{ inputs.codeartifact-aws-role-to-assume }}
        codeartifact-domain: ${{ inputs.codeartifact-domain }}

    - name: Export Registry Environment
      env:
        TOKEN: ${{ steps.codeartifact.outputs.token }}
        ACCOUNT_ID: ${{ inputs.codeartifact-aws-account-id }}
        DOMAIN: ${{ inputs.codeartifact-domain }}
        REPOSITORY: ${{ inputs.codeartifact-repository }}
        NAMESPACE: ${{ inputs.codeartifact-registry-namespace }}
      run: |
        {
          echo "CODEARTIFACT_AUTH_TOKEN=${TOKEN}"
          echo "AWS_ACCOUNT_ID=${ACCOUNT_ID}"
          echo "AWS_CODE_ARTIFACT_DOMAIN=${DOMAIN}"
          echo "AWS_CODE_ARTIFACT_REPOSITORY=${REPOSITORY}"
          echo "REGISTRY_NAMESPACE=${NAMESPACE}"
        } >> "$GITHUB_ENV"
      shell: bash
