name: Setup JavaScript Environment without Install
description: >-
  Sets up a pnpm JavaScript project, assumes the CodeArtifact role, and exports
  CODEARTIFACT_AUTH_TOKEN for the consumer's registry authentication script.

inputs:
  AWS_ACCOUNT_ID:
    description: AWS Account ID hosting CodeArtifact
    required: true
  AWS_REGION:
    description: AWS region hosting CodeArtifact
    required: true
  AWS_ROLE_TO_ASSUME:
    description: AWS role to assume for CodeArtifact repository access
    required: true
  AWS_CODE_ARTIFACT_DOMAIN:
    description: AWS CodeArtifact domain
    required: true
  AWS_CODE_ARTIFACT_REPOSITORY:
    description: AWS CodeArtifact repository
    required: true
  REGISTRY_NAMESPACE:
    description: Namespace to use for registry authentication.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Environment
      run: make setup-env
      shell: bash

    # Without an explicit version, uses packageManager version from package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Get CodeArtifact Token
      id: codeartifact
      uses: 24dlong/github-actions-library/actions/aws/codeartifact-token@v6
      with:
        AWS_ACCOUNT_ID: ${{ inputs.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ inputs.AWS_REGION }}
        AWS_ROLE_TO_ASSUME: ${{ inputs.AWS_ROLE_TO_ASSUME }}
        AWS_CODE_ARTIFACT_DOMAIN: ${{ inputs.AWS_CODE_ARTIFACT_DOMAIN }}

    # Consumer registry-auth scripts use this instead of calling `aws codeartifact login`.
    - name: Export CodeArtifact Token
      env:
        TOKEN: ${{ steps.codeartifact.outputs.token }}
      run: echo "CODEARTIFACT_AUTH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      shell: bash
