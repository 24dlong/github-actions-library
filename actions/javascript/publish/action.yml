name: Publish
description: Runs Quality Gate checks and creates a GitHub release for a generic JavaScript repository.

inputs:
  github-token:
    description: GitHub token from the calling workflow, exposed to `make publish` as GITHUB_TOKEN.
    required: true
  codeartifact-aws-account-id:
    description: AWS account ID that owns the CodeArtifact domain.
    required: true
  codeartifact-aws-region:
    description: AWS region of the CodeArtifact domain.
    required: true
  codeartifact-aws-role-to-assume:
    description: ARN of the AWS IAM role allowed to read from (and, for libraries, publish to) CodeArtifact.
    required: true
  codeartifact-domain:
    description: CodeArtifact domain name.
    required: true
  codeartifact-repository:
    description: CodeArtifact repository name.
    required: true
  codeartifact-registry-namespace:
    description: npm scope served by CodeArtifact (e.g. "@my-org").
    required: true

outputs:
  released:
    description: "'true' if `make publish` created a new v<semver> tag on HEAD, otherwise 'false'."
    value: ${{ steps.release.outputs.released }}
  version:
    description: Released version without the leading v (e.g. 1.2.3). Empty when nothing was released.
    value: ${{ steps.release.outputs.version }}

runs:
  using: composite
  steps:
    - name: Quality Gate
      # TODO: This technically creates a potential issue where an older version of the publish action
      # could call a later version of the quality-gate action. This isn't a problem if breaking changes
      # in the quality-gate action are properly managed with major versions, however, it's not ideal.
      # However, GitHub currently doesn't allow local references in composite actions, accessing the
      # version of composite action called, or passing any variable to the uses parameter. Since this will
      # only be used internally, taking this as the lesser of two evils, rather than duplicating the
      # quality-gate steps here.
      uses: 24dlong/github-actions-library/actions/javascript/quality-gate@v6
      with:
        codeartifact-aws-account-id: ${{ inputs.codeartifact-aws-account-id }}
        codeartifact-aws-region: ${{ inputs.codeartifact-aws-region }}
        codeartifact-aws-role-to-assume: ${{ inputs.codeartifact-aws-role-to-assume }}
        codeartifact-domain: ${{ inputs.codeartifact-domain }}
        codeartifact-repository: ${{ inputs.codeartifact-repository }}
        codeartifact-registry-namespace: ${{ inputs.codeartifact-registry-namespace }}

    - name: Record Existing Tags
      id: existing-tags
      run: |
        set -euo pipefail
        git fetch --tags --force --quiet
        echo "tags=$(git tag --points-at HEAD --list 'v[0-9]*' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      shell: bash

    # Registry environment variables are exported by the setup action.
    - name: Release
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: make publish
      shell: bash

    - name: Detect Release
      id: release
      env:
        EXISTING_TAGS: ${{ steps.existing-tags.outputs.tags }}
      run: |
        set -euo pipefail
        tag=""
        for candidate in $(git tag --points-at HEAD --list 'v[0-9]*' --sort=-v:refname); do
          if [[ " ${EXISTING_TAGS} " != *" ${candidate} "* ]]; then
            tag="$candidate"
            break
          fi
        done
        if [[ -n "$tag" ]]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
