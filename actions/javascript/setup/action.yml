name: Setup JavaScript Environment
description: Sets up a pnpm JavaScript project and installs dependencies from AWS CodeArtifact.

inputs:
  codeartifact-aws-account-id:
    description: AWS account ID that owns the CodeArtifact domain.
    required: true
  codeartifact-aws-region:
    description: AWS region of the CodeArtifact domain.
    required: true
  codeartifact-aws-role-to-assume:
    description: ARN of the AWS IAM role allowed to read from CodeArtifact.
    required: true
  codeartifact-domain:
    description: CodeArtifact domain name.
    required: true
  codeartifact-repository:
    description: CodeArtifact repository name.
    required: true
  codeartifact-registry-namespace:
    description: npm scope served by CodeArtifact (e.g. "@my-org").
    required: true

runs:
  using: composite
  steps:
    - name: Setup JavaScript Environment
      id: setup
      uses: 24dlong/github-actions-library/actions/javascript/setup-no-install@v7
      with:
        codeartifact-aws-account-id: ${{ inputs.codeartifact-aws-account-id }}
        codeartifact-aws-region: ${{ inputs.codeartifact-aws-region }}
        codeartifact-aws-role-to-assume: ${{ inputs.codeartifact-aws-role-to-assume }}
        codeartifact-domain: ${{ inputs.codeartifact-domain }}
        codeartifact-repository: ${{ inputs.codeartifact-repository }}
        codeartifact-registry-namespace: ${{ inputs.codeartifact-registry-namespace }}

    - name: Install Dependencies
      run: make install
      shell: bash

    # Only after a successful install, and only on a key miss, so a failed or
    # partial install never becomes the cache for this lockfile. Prune first:
    # a restore-keys fallback brings in an older lockfile's store, and prune
    # drops only packages no installed project references, so the saved store
    # stays the size of this lockfile. A failed prune still saves.
    - name: Prune pnpm store
      if: steps.setup.outputs.pnpm-cache-hit != 'true'
      continue-on-error: true
      run: pnpm store prune
      shell: bash

    - name: Save pnpm store
      if: steps.setup.outputs.pnpm-cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.setup.outputs.pnpm-store-path }}
        key: ${{ steps.setup.outputs.pnpm-cache-key }}
