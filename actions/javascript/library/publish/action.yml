name: Publish
description: >-
  Runs Quality Gate checks and publishes a JavaScript library to AWS CodeArtifact.
  The consumer's `make publish` is responsible for the CodeArtifact publish.

inputs:
  GITHUB_TOKEN:
    description: GitHub token from the calling workflow
    required: true
  AWS_ACCOUNT_ID:
    description: AWS Account ID hosting CodeArtifact
    required: true
  AWS_REGION:
    description: AWS region hosting CodeArtifact
    required: true
  AWS_ROLE_TO_ASSUME:
    description: AWS role to assume for CodeArtifact repository access
    required: true
  AWS_CODE_ARTIFACT_DOMAIN:
    description: AWS CodeArtifact domain
    required: true
  AWS_CODE_ARTIFACT_REPOSITORY:
    description: AWS CodeArtifact repository
    required: true
  REGISTRY_NAMESPACE:
    description: Namespace to use for registry authentication.
    required: true

outputs:
  released:
    description: "'true' if a new version was released, otherwise 'false'."
    value: ${{ steps.publish.outputs.released }}
  version:
    description: Released version without the leading v. Empty when nothing was released.
    value: ${{ steps.publish.outputs.version }}

runs:
  using: composite
  steps:
    - name: Publish
      id: publish
      uses: 24dlong/github-actions-library/actions/javascript/publish@v6
      with:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        AWS_ACCOUNT_ID: ${{ inputs.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ inputs.AWS_REGION }}
        AWS_ROLE_TO_ASSUME: ${{ inputs.AWS_ROLE_TO_ASSUME }}
        AWS_CODE_ARTIFACT_DOMAIN: ${{ inputs.AWS_CODE_ARTIFACT_DOMAIN }}
        AWS_CODE_ARTIFACT_REPOSITORY: ${{ inputs.AWS_CODE_ARTIFACT_REPOSITORY }}
        REGISTRY_NAMESPACE: ${{ inputs.REGISTRY_NAMESPACE }}
