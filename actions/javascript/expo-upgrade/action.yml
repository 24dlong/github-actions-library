name: Upgrade Expo dependencies
description: Upgrades Expo dependencies based on the Expo SDK version in the target branch

inputs:
  working-directory:
    description: Directory of the Expo project, relative to the repository root (e.g. "apps/mobile").
    required: false
    default: .
  github-app-client-id:
    description: GitHub App client ID used to commit dependency updates.
    required: true
  github-app-private-key:
    description: GitHub App private key used to commit dependency updates.
    required: true
  codeartifact-aws-account-id:
    description: AWS account ID that owns the CodeArtifact domain.
    required: true
  codeartifact-aws-region:
    description: AWS region of the CodeArtifact domain.
    required: true
  codeartifact-aws-role-to-assume:
    description: ARN of the AWS IAM role allowed to read from CodeArtifact.
    required: true
  codeartifact-domain:
    description: CodeArtifact domain name.
    required: true
  codeartifact-repository:
    description: CodeArtifact repository name.
    required: true
  codeartifact-registry-namespace:
    description: npm scope served by CodeArtifact (e.g. "@my-org").
    required: true

outputs:
  changed:
    description: Whether Expo dependency updates changed and were pushed to the branch.
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        permission-contents: write

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: Setup JavaScript Environment
      uses: 24dlong/github-actions-library/actions/javascript/setup-no-install@v7
      with:
        codeartifact-aws-account-id: ${{ inputs.codeartifact-aws-account-id }}
        codeartifact-aws-region: ${{ inputs.codeartifact-aws-region }}
        codeartifact-aws-role-to-assume: ${{ inputs.codeartifact-aws-role-to-assume }}
        codeartifact-domain: ${{ inputs.codeartifact-domain }}
        codeartifact-repository: ${{ inputs.codeartifact-repository }}
        codeartifact-registry-namespace: ${{ inputs.codeartifact-registry-namespace }}

    # Registry environment variables are exported by the setup action.
    - name: Private Registry Authentication
      run: make registry-auth
      shell: bash

    # expo install --fix leaves two things wrong that this action repairs:
    # - it does not understand pnpm catalogs: it replaces a catalog: specifier
    #   with a literal version and leaves the catalog stale;
    # - it moves react-native but not its @react-native/* companions, which
    #   are not in Expo's version map and must match react-native exactly.
    # Record the specifiers now so they can be reconciled afterwards.
    - name: Record Specifiers
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/reconcile-specifiers.mjs" snapshot "$RUNNER_TEMP/expo-specifiers.json"
      shell: bash

    - name: Upgrade Expo Dependencies
      working-directory: ${{ inputs.working-directory }}
      env:
        CI: false # pnpm enables frozen-lockfile when CI=true
      # With a dynamic app config (app.config.ts) Expo cannot add the config
      # plugins of the packages it just installed, so --fix exits 1 after the
      # dependencies but before the devDependencies. The second pass only has
      # devDependencies left. --check then fails the step if anything is still
      # out of line with the SDK.
      run: |
        pnpm exec expo install --fix || pnpm exec expo install --fix
        pnpm exec expo install --check
      shell: bash

    - name: Reconcile Specifiers
      id: reconcile
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/reconcile-specifiers.mjs" reconcile "$RUNNER_TEMP/expo-specifiers.json"
      shell: bash

    - name: Refresh Lockfile
      if: steps.reconcile.outputs.changed == 'true'
      working-directory: ${{ inputs.working-directory }}
      env:
        CI: false # pnpm enables frozen-lockfile when CI=true
      run: pnpm install --no-frozen-lockfile
      shell: bash

    # Expo resolves new versions into a lockfile that still holds the old ones
    # for other packages, so the same native module can end up installed twice
    # (expo-doctor fails on that). Only when the upgrade changed something, so
    # a clean run does not rewrite the lockfile.
    - name: Deduplicate Dependencies
      working-directory: ${{ inputs.working-directory }}
      env:
        CI: false # pnpm enables frozen-lockfile when CI=true
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          pnpm dedupe
        fi
      shell: bash

    - name: Commit Expo Dependency Updates
      id: commit
      uses: 24dlong/github-actions-library/actions/javascript/commit@v7
      with:
        github-app-slug: ${{ steps.app-token.outputs.app-slug }}
        github-token: ${{ steps.app-token.outputs.token }}
        branch: ${{ github.head_ref || github.ref_name }}
        commit-message: "chore: upgrade Expo dependencies"
