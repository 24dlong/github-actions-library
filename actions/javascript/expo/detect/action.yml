name: Expo Detect
description: >-
  Decides whether a release needs mobile work (a native build or an OTA
  update). Compares the release tag (v<version>) with the last release that
  has mobile assets attached (falling back to the previous v* tag) and acts
  only when a path in `paths` changed between them. A release counts as handled
  when every platform has a build asset (`mobile-<platform>-*`) or an OTA
  record (`mobile-ota-<platform>-*`). A release that never got either, because
  the work failed or was dropped, is therefore compared again by the next
  release. Whether the work is a build or an OTA update is Expo Fingerprint's
  call, not this action's.
  Checks out the repository itself (full history), so run
  it as its own job. Also resolves the version to build when a forced run has
  nothing newly released.

inputs:
  version:
    description: Released version without the leading v. Empty when nothing was released.
    required: false
    default: ""
  paths:
    description: >-
      Newline-separated git pathspecs that can change the native build (for
      example "apps/mobile"). Empty means always build.
    required: false
    default: ""
  force:
    description: >-
      Build regardless of changes. With an empty `version`, builds the latest
      v* tag's version.
    required: false
    default: "false"
  platforms:
    description: >-
      Comma-separated platforms the caller publishes. A release counts as
      handled only when it has an asset named mobile-<platform>-* or
      mobile-ota-<platform>-* for every one.
    required: false
    default: ios,android
  github-token:
    description: Token that can read releases. Needs contents read.
    required: false
    default: ${{ github.token }}

outputs:
  build:
    description: "'true' if mobile work (a build or an OTA update) should run, otherwise 'false'."
    value: ${{ steps.decide.outputs.build }}
  version:
    description: Version to build. Empty when nothing was released and `force` is false.
    value: ${{ steps.decide.outputs.version }}
  reason:
    description: One-line explanation of the decision.
    value: ${{ steps.decide.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Decide
      id: decide
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        build=false
        reason=""
        previous=""
        source=""
        changed=""
        version="${INPUT_VERSION#v}"

        if [[ -z "${version}" ]]; then
          if [[ "${INPUT_FORCE}" == "true" ]]; then
            tag="$(git tag --list 'v*' --sort=-v:refname | sed -n 1p)"
            if [[ -z "${tag}" ]]; then
              echo "No version given and no v* tag to build" >&2
              exit 1
            fi
            version="${tag#v}"
          else
            reason="Nothing was released"
          fi
        fi

        if [[ -n "${version}" ]]; then
          paths=()
          while IFS= read -r line; do
            if [[ -n "${line//[[:space:]]/}" ]]; then
              paths+=("${line}")
            fi
          done <<< "${INPUT_PATHS}"

          if [[ "${INPUT_FORCE}" == "true" ]]; then
            build=true
            reason="Forced"
          elif (( ${#paths[@]} == 0 )); then
            build=true
            reason="No paths to compare, always build"
          elif ! git rev-parse --verify --quiet "refs/tags/v${version}" > /dev/null; then
            build=true
            reason="Tag v${version} not found, cannot compare"
          else
            # Prefer the newest older release whose assets show the mobile
            # work finished. The release job attaches mobile-<platform>-*
            # build files and mobile-ota-<platform>-* update records; a failed
            # or skipped run leaves none.
            platforms="$(jq -Rc 'split(",") | map(gsub("\\s"; "")) | map(select(length > 0))' <<< "${INPUT_PLATFORMS}")"
            built=""
            while IFS= read -r tag; do
              if [[ -n "${tag}" && "${tag}" != "v${version}" ]] \
                && git merge-base --is-ancestor "refs/tags/${tag}" "refs/tags/v${version}" 2> /dev/null; then
                built="${tag}"
                break
              fi
            done < <(
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" 2> /dev/null \
                | jq -r --argjson platforms "${platforms}" '
                    .[]
                    | select(.draft | not)
                    | select(.tag_name | startswith("v"))
                    | select(.assets as $assets
                        | $platforms | all(. as $p | $assets | any(.name | startswith("mobile-\($p)-") or startswith("mobile-ota-\($p)-"))))
                    | .tag_name' \
                || true
            )
            if [[ -n "${built}" ]]; then
              previous="${built}"
              source="last mobile build"
            else
              previous="$(git describe --tags --abbrev=0 --match 'v*' "v${version}^" 2> /dev/null || true)"
              source="previous release"
            fi
            if [[ -z "${previous}" ]]; then
              build=true
              reason="No previous v* tag, first release"
            else
              changed="$(git diff --name-only "${previous}" "v${version}" -- "${paths[@]}")"
              if [[ -n "${changed}" ]]; then
                build=true
                reason="Native paths changed since ${previous} (${source})"
              else
                reason="No native paths changed since ${previous} (${source})"
              fi
            fi
          fi
        fi

        {
          echo "build=${build}"
          echo "version=${version}"
          echo "reason=${reason}"
        } >> "${GITHUB_OUTPUT}"

        {
          echo "## Expo detect"
          echo
          echo "- Version: \`${version:-none}\`"
          echo "- Build: \`${build}\`"
          echo "- Reason: ${reason}"
          if [[ -n "${changed}" ]]; then
            echo
            echo "Changed files (first 20):"
            echo
            echo '```'
            echo "${changed}" | sed -n 1,20p
            echo '```'
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
      shell: bash
