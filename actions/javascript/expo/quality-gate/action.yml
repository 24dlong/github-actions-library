name: Expo Quality Gate
description: >-
  Runs Expo-specific quality checks (currently Expo Doctor) for an Expo project.
  Self-contained: checks out and installs dependencies itself, so run it as its
  own job alongside the base JavaScript quality gate.

inputs:
  working-directory:
    description: Directory of the Expo project, relative to the repository root (e.g. "apps/mobile").
    required: false
    default: .
  AWS_ACCOUNT_ID:
    description: AWS Account ID hosting CodeArtifact
    required: true
  AWS_REGION:
    description: AWS region hosting CodeArtifact
    required: true
  AWS_ROLE_TO_ASSUME:
    description: AWS role to assume for CodeArtifact repository access
    required: true
  AWS_CODE_ARTIFACT_DOMAIN:
    description: AWS CodeArtifact domain
    required: true
  AWS_CODE_ARTIFACT_REPOSITORY:
    description: AWS CodeArtifact repository
    required: true
  REGISTRY_NAMESPACE:
    description: Namespace to use for registry authentication.
    required: true

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup JavaScript
      uses: 24dlong/github-actions-library/actions/javascript/setup@v6
      with:
        AWS_ACCOUNT_ID: ${{ inputs.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ inputs.AWS_REGION }}
        AWS_ROLE_TO_ASSUME: ${{ inputs.AWS_ROLE_TO_ASSUME }}
        AWS_CODE_ARTIFACT_DOMAIN: ${{ inputs.AWS_CODE_ARTIFACT_DOMAIN }}
        AWS_CODE_ARTIFACT_REPOSITORY: ${{ inputs.AWS_CODE_ARTIFACT_REPOSITORY }}
        REGISTRY_NAMESPACE: ${{ inputs.REGISTRY_NAMESPACE }}

    - name: Expo Doctor
      working-directory: ${{ inputs.working-directory }}
      run: npx expo-doctor
      shell: bash
