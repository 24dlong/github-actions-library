name: Expo Build
description: >-
  Builds an Expo app locally (the spoke's `make package`) and uploads the
  artifact. Checks out and installs dependencies itself, so run it as its own
  job. `eas build --local` reinstalls in a temp copy, so this action's setup
  must leave CodeArtifact auth in ~/.npmrc (the spoke's `make registry-auth`,
  run by `make install`). Holds no eas flags; the spoke Makefile owns those.

inputs:
  working-directory:
    description: Directory of the Expo project, relative to the repository root (e.g. "apps/mobile").
    required: true
  platform:
    description: "Build platform: ios or android."
    required: true
  profile:
    description: eas.json build profile. Production is the store profile (.ipa / .aab).
    required: false
    default: production
  version:
    description: App version, exported as APP_VERSION for app.config.ts.
    required: true
  expo-token:
    description: Expo robot token (EXPO_TOKEN). Required for credentials and remote build numbers.
    required: true
  sentry-auth-token:
    description: Sentry auth token (SENTRY_AUTH_TOKEN). Required so source-map upload cannot be skipped silently.
    required: true
  codeartifact-aws-account-id:
    description: AWS account ID that owns the CodeArtifact domain.
    required: true
  codeartifact-aws-region:
    description: AWS region of the CodeArtifact domain.
    required: true
  codeartifact-aws-role-to-assume:
    description: ARN of the AWS IAM role allowed to read from CodeArtifact.
    required: true
  codeartifact-domain:
    description: CodeArtifact domain name.
    required: true
  codeartifact-repository:
    description: CodeArtifact repository name.
    required: true
  codeartifact-registry-namespace:
    description: npm scope served by CodeArtifact (e.g. "@my-org").
    required: true

outputs:
  artifact-path:
    description: Built artifact path, relative to working-directory (for example dist/app.aab).
    value: ${{ steps.package.outputs.path }}
  artifact-name:
    description: Name of the uploaded workflow artifact (mobile-<platform>-<version>).
    value: ${{ steps.upload-build.outputs.artifact-id && format('mobile-{0}-{1}', inputs.platform, inputs.version) || '' }}
  build-number:
    description: Build number (iOS) or version code (Android) eas auto-incremented to, when it logged one.
    value: ${{ steps.package.outputs.build-number }}

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Require tokens
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
      run: |
        set -euo pipefail
        missing=()
        if [[ -z "${EXPO_TOKEN}" ]]; then
          missing+=("EXPO_TOKEN")
        fi
        if [[ -z "${SENTRY_AUTH_TOKEN}" ]]; then
          missing+=("SENTRY_AUTH_TOKEN")
        fi
        if (( ${#missing[@]} )); then
          echo "Missing required token(s): ${missing[*]}" >&2
          exit 1
        fi
      shell: bash

    # A standard Linux runner has ~14 GB free. The eas temp copy, pnpm install,
    # Gradle and the CMake builds of the native modules overrun it ("Disk quota
    # exceeded"), so drop preinstalled toolchains the build never uses first.
    # The Android SDK under /usr/local/lib/android stays.
    - name: Free disk space
      if: inputs.platform == 'android'
      run: |
        set -euo pipefail
        df -h / /mnt || true
        paths=(
          /usr/share/dotnet
          /opt/ghc
          /usr/local/.ghcup
          /usr/local/share/boost
          /opt/hostedtoolcache/CodeQL
          /usr/share/swift
        )
        for path in "${paths[@]}"; do
          sudo rm -rf "${path}" &
        done
        wait
        sudo docker image prune --all --force > /dev/null 2>&1 || true
        df -h / /mnt || true
      shell: bash

    # eas build --local works in a temp copy of the repo. Put it on the runner's
    # separate /mnt disk (when there is one) instead of the root disk.
    - name: Prepare build directory
      if: inputs.platform == 'android'
      run: |
        set -euo pipefail
        if [[ -d /mnt ]]; then
          sudo mkdir -p /mnt/eas-build
          sudo chown "$(id -u):$(id -g)" /mnt/eas-build
          echo "EAS_LOCAL_BUILD_WORKINGDIR=/mnt/eas-build" >> "${GITHUB_ENV}"
        fi
      shell: bash

    - name: Select Xcode
      if: inputs.platform == 'ios'
      run: |
        set -euo pipefail
        sudo xcode-select -s /Applications/Xcode_26.4.1.app
        xcodebuild -version
        pod --version
        fastlane --version
      shell: bash

    - name: Install Apple WWDR G3
      if: inputs.platform == 'ios'
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
        security add-certificates -k "${HOME}/Library/Keychains/login.keychain-db" /tmp/AppleWWDRCAG3.cer
      shell: bash

    # ios/ is generated inside the eas temp copy, so the repo usually has no
    # Podfile.lock; the pnpm lockfile pins the native modules that decide the
    # pods. A fixed key would be saved once and never refreshed. Restore and
    # save are split so a late failure (submit, in the caller's job) still
    # keeps a cache that a successful package step filled.
    - name: Restore CocoaPods
      id: cocoapods-cache
      if: inputs.platform == 'ios'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/Library/Caches/CocoaPods
          ~/.cocoapods
        key: cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-${{ hashFiles('pnpm-lock.yaml', format('{0}/ios/Podfile.lock', inputs.working-directory)) }}
        restore-keys: |
          cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-

    # React Native core, dependencies and Hermes tarballs, downloaded by pod
    # install. The pnpm lockfile pins the react-native version.
    - name: Restore React Native tarballs
      id: react-native-cache
      if: inputs.platform == 'ios'
      uses: actions/cache/restore@v6
      with:
        path: ~/Library/Caches/ReactNative
        key: react-native-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          react-native-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-

    - name: Setup Java
      if: inputs.platform == 'android'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    # The Gradle project is generated inside the eas temp copy. This still
    # caches ~/.gradle, which that build uses. Wrappers are not in the repo.
    # cache-read-only is forced off so a retry on a non-default branch keeps
    # what a flaky dl.google.com run already downloaded.
    - name: Setup Gradle
      if: inputs.platform == 'android'
      uses: gradle/actions/setup-gradle@v6
      with:
        validate-wrappers: false
        cache-read-only: false

    - name: Setup JavaScript
      uses: 24dlong/github-actions-library/actions/javascript/setup@v7
      with:
        codeartifact-aws-account-id: ${{ inputs.codeartifact-aws-account-id }}
        codeartifact-aws-region: ${{ inputs.codeartifact-aws-region }}
        codeartifact-aws-role-to-assume: ${{ inputs.codeartifact-aws-role-to-assume }}
        codeartifact-domain: ${{ inputs.codeartifact-domain }}
        codeartifact-repository: ${{ inputs.codeartifact-repository }}
        codeartifact-registry-namespace: ${{ inputs.codeartifact-registry-namespace }}

    - name: Package
      id: package
      env:
        APP_VERSION: ${{ inputs.version }}
        EXPO_TOKEN: ${{ inputs.expo-token }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
        PLATFORM: ${{ inputs.platform }}
        PROFILE: ${{ inputs.profile }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # The Makefile names the file from eas.json and records that path.
        log="${RUNNER_TEMP}/package.log"
        make -C "${WORKING_DIRECTORY}" package \
          PLATFORM="${PLATFORM}" \
          PROFILE="${PROFILE}" \
          OUTPUT_DIR=dist 2>&1 | tee "${log}"
        path="$(< "${WORKING_DIRECTORY}/dist/.artifact-path")"
        if [[ -z "${path}" || "${path}" == *$'\n'* ]]; then
          echo "package did not report a single artifact path" >&2
          exit 1
        fi
        echo "path=${path}" >> "${GITHUB_OUTPUT}"
        # Best effort, for the summary: eas logs the remote build number when
        # it increments it. Empty when the profile does not auto-increment.
        build_number="$(sed -nE 's/.*Incremented (buildNumber|versionCode) from [0-9]+ to ([0-9]+).*/\2/p' "${log}" | tail -n 1)"
        echo "build-number=${build_number}" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: Report disk usage
      if: always() && inputs.platform == 'android'
      run: df -h / /mnt || true
      shell: bash

    # Right after package, before submit can fail the job. Only on a key miss
    # and only after a successful package, so a partial cache is never saved.
    - name: Save CocoaPods
      if: inputs.platform == 'ios' && steps.cocoapods-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/Library/Caches/CocoaPods
          ~/.cocoapods
        key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

    - name: Save React Native tarballs
      if: inputs.platform == 'ios' && steps.react-native-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/Library/Caches/ReactNative
        key: ${{ steps.react-native-cache.outputs.cache-primary-key }}

    - name: Upload build
      id: upload-build
      uses: actions/upload-artifact@v7
      with:
        name: mobile-${{ inputs.platform }}-${{ inputs.version }}
        path: ${{ inputs.working-directory }}/${{ steps.package.outputs.path }}
        if-no-files-found: error

    - name: Collect iOS gym logs
      id: gym
      if: always() && inputs.platform == 'ios'
      run: |
        set -euo pipefail
        if [[ -d "${HOME}/Library/Logs/gym" ]]; then
          mkdir -p gym-logs
          cp -R "${HOME}/Library/Logs/gym/." gym-logs/
          echo "found=true" >> "${GITHUB_OUTPUT}"
        else
          echo "found=false" >> "${GITHUB_OUTPUT}"
        fi
      shell: bash

    - name: Upload gym logs
      if: always() && steps.gym.outputs.found == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: mobile-ios-gym-${{ inputs.version }}
        path: gym-logs
        if-no-files-found: ignore
